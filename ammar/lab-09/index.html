<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="data.js"></script>
    <script src="function.js"></script>
</head>
<body>

<div class="cart-container">
    <h2>SHOPPING CART</h2>

    <table>
        <thead>
            <tr>
                <th colspan="2">Product</th>
                <th class="center">#</th>
                <th class="right">Price</th>
                <th class="right">Amount</th>
            </tr>
        </thead>
        <tbody>
            <script src="Lab9.js"></script>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4" class="summary-label">Subtotal</td>
                <td class="summary-value"><script>outputCurrency(subtotal);</script></td>
            </tr>
            <tr>
                <td colspan="4" class="summary-label">Tax</td>
                <td class="summary-value"><script>outputCurrency(tax);</script></td>
            </tr>
            <tr>
                <td colspan="4" class="summary-label">Shipping</td>
                <td class="summary-value"><script>outputCurrency(shipping);</script></td>
            </tr>
            <tr class="grand-total-row">
                <td colspan="4" class="grand-total-label">Grand Total</td>
                <td class="grand-total-value"><script>outputCurrency(grand);</script></td>
            </tr>
        </tfoot>
    </table>
</div>

</body>
</html>
